<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>钟英中学百廿校庆 AR 互动卡片</title>

  <!-- MindAR 图像追踪（标准 CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* 加载页 */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #f5e6c8;
      background: linear-gradient(135deg, #8b1a1a 0%, #2c1810 100%); z-index: 999;
    }
    #loading h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: 6px; }
    #loading p { font-size: 13px; opacity: 0.75; margin: 4px 0; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(245,230,200,0.2);
      border-top-color: #f5e6c8; border-radius: 50%;
      animation: spin 1s linear infinite; margin: 18px 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 扫描提示 */
    #scanning {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(139,26,26,0.85); padding: 12px 24px;
      border-radius: 24px; font-size: 14px; z-index: 10; pointer-events: none;
      backdrop-filter: blur(8px); white-space: nowrap;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* 识别成功提示 */
    #found {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: #f5e6c8; background: rgba(44,95,63,0.9); padding: 8px 20px;
      border-radius: 16px; font-size: 13px; z-index: 10; display: none;
      backdrop-filter: blur(6px);
    }

    /* 信息面板 */
    #info-panel {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      width: 88%; max-width: 360px; background: rgba(255,255,255,0.97);
      border-radius: 14px; padding: 18px; z-index: 30; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    #info-panel h2 { margin: 0 0 10px; font-size: 17px; color: #8b1a1a; }
    #info-panel p { margin: 0; font-size: 13.5px; line-height: 1.8; color: #333; }
    #info-panel .close {
      position: absolute; top: 10px; right: 14px; font-size: 22px;
      color: #aaa; cursor: pointer; background: none; border: none; line-height: 1;
    }
  </style>
</head>
<body>

  <!-- 加载页（MindAR 加载完成后自动隐藏） -->
  <div id="loading">
    <h1>钟阜育英才</h1>
    <p>南京市钟英中学 · 百廿校庆 AR</p>
    <div class="spinner"></div>
    <p>正在加载识别模型…</p>
  </div>

  <!-- 扫描提示 -->
  <div id="scanning">📷 将镜头对准校庆海报 / 卡片</div>

  <!-- 识别成功提示 -->
  <div id="found">✅ 已识别，移动手机查看 3D 效果</div>

  <!-- 信息面板 -->
  <div id="info-panel">
    <button class="close" onclick="document.getElementById('info-panel').style.display='none'">×</button>
    <h2 id="panel-title"></h2>
    <p id="panel-content"></p>
  </div>

  <!-- AR 场景：autoStart 默认 true，自动启动 -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: #loading; uiScanning: #scanning;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-mixin id="leaf" geometry="primitive: plane; width: 0.09; height: 0.09"
               material="color: #f5c542; transparent: true; opacity: 0.92; side: double"></a-mixin>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 识别到标记图（targetIndex: 0）后显示的所有内容 -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- 灯光 -->
      <a-entity light="type: ambient; color: #fff5e6; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; color: #f5c542; intensity: 1.0" position="2 3 2"></a-entity>

      <!-- 旋转的金色 120 -->
      <a-text
        value="120"
        color="#f5c542"
        align="center"
        width="1.0"
        position="0 0.32 0.08"
        rotation="-90 0 0"
        text="anchor: center; baseline: center; font: https://cdn.aframe.io/fonts/Roboto-msdf.json; negate: false"
        animation="property: rotation; from: -90 0 0; to: -90 360 0; loop: true; dur: 7000; easing: linear">
      </a-text>

      <!-- 校庆副标题 -->
      <a-text
        value="钟英中学 · 百廿校庆"
        color="#8b1a1a"
        align="center"
        width="1.3"
        position="0 0.14 0.08"
        rotation="-90 0 0"
        text="anchor: center; baseline: center">
      </a-text>

      <!-- 校训 -->
      <a-text
        value="勤朴诚毅"
        color="#2c5f3f"
        align="center"
        width="0.8"
        position="0 -0.02 0.08"
        rotation="-90 0 0"
        text="anchor: center; baseline: center">
      </a-text>

      <!-- 按钮：校史沿革 -->
      <a-plane
        class="clickable"
        width="0.52" height="0.2"
        color="#8b1a1a"
        position="-0.36 -0.22 0.08"
        rotation="-90 0 0"
        data-title="校史沿革"
        data-content="1904年创办，始名承志，后更名钟英，取「钟阜育英才」之意，为南京近代首所私立中学。百廿年来八迁校址，历经抗战西迁，1954年定址秦淮九条巷曾公祠，2014年恢复钟英校名。校训「勤朴诚毅」，以「知责任、明责任、担责任、尽责任」的责文化育人。">
        <a-text value="校史沿革" color="#f5e6c8" align="center" width="0.48"
                position="0 0 0.006" text="anchor: center; baseline: center"></a-text>
      </a-plane>

      <!-- 按钮：杰出校友 -->
      <a-plane
        class="clickable"
        width="0.52" height="0.2"
        color="#2c5f3f"
        position="0.36 -0.22 0.08"
        rotation="-90 0 0"
        data-title="杰出校友"
        data-content="两弹一星元勋任新民、两院院士建筑学家吴良镛、前教育部长刘西尧、著名画家刘宇一、作家叶兆言、演员游本昌……钟阜毓秀，英才辈出。民间素有「数学精，进钟英」「要当兵，进钟英」之誉。">
        <a-text value="杰出校友" color="#f5e6c8" align="center" width="0.48"
                position="0 0 0.006" text="anchor: center; baseline: center"></a-text>
      </a-plane>

      <!-- 飘落银杏叶 -->
      <a-entity id="leaves"></a-entity>

    </a-entity>
  </a-scene>

  <script>
    // ===== 银杏叶飘落动画 =====
    const leavesContainer = document.getElementById('leaves');
    const leafColors = ['#f5c542', '#e8a317', '#f0d060', '#d4a017'];
    for (let i = 0; i < 18; i++) {
      const leaf = document.createElement('a-entity');
      leaf.setAttribute('mixin', 'leaf');
      const x = (Math.random() - 0.5) * 1.4;
      const y = 0.5 + Math.random() * 0.4;
      const z = 0.05 + Math.random() * 0.1;
      const delay = Math.random() * 5000;
      const dur = 3500 + Math.random() * 2500;
      leaf.setAttribute('position', `${x} ${y} ${z}`);
      leaf.setAttribute('rotation', `-90 0 ${Math.random() * 360}`);
      leaf.setAttribute('material', `color: ${leafColors[Math.floor(Math.random() * leafColors.length)]}`);
      leaf.setAttribute('animation', `property: position; to: ${x + (Math.random()-0.5)*0.3} -0.45 ${z}; loop: true; dur: ${dur}; delay: ${delay}; easing: easeInQuad`);
      leaf.setAttribute('animation__2', `property: rotation; to: -90 0 ${Math.random() * 720}; loop: true; dur: ${dur}; delay: ${delay}; easing: linear`);
      leavesContainer.appendChild(leaf);
    }

    // ===== 识别成功事件 =====
    const sceneEl = document.querySelector('a-scene');
    const foundEl = document.getElementById('found');
    const scanningEl = document.getElementById('scanning');

    sceneEl.addEventListener('targetFound', () => {
      foundEl.style.display = 'block';
      scanningEl.style.display = 'none';
      setTimeout(() => { foundEl.style.display = 'none'; }, 3000);
    });
    sceneEl.addEventListener('targetLost', () => {
      scanningEl.style.display = 'block';
    });

    // ===== 点击交互 =====
    const panel = document.getElementById('info-panel');
    sceneEl.addEventListener('click', (e) => {
      const target = e.target.closest('.clickable');
      if (target) {
        document.getElementById('panel-title').textContent = target.dataset.title;
        document.getElementById('panel-content').textContent = target.dataset.content;
        panel.style.display = 'block';
      }
    });

    // 点击面板外关闭
    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && !e.target.closest('.clickable')) {
        panel.style.display = 'none';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>钟英中学百廿校庆 AR</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #f5e6c8;
      background: linear-gradient(135deg, #8b1a1a 0%, #2c1810 100%); z-index: 999;
    }
    #loading h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: 6px; }
    #loading p { font-size: 12px; opacity: 0.7; margin: 3px 0; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(245,230,200,0.2);
      border-top-color: #f5e6c8; border-radius: 50%;
      animation: spin 1s linear infinite; margin: 14px 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #debug {
      position: fixed; bottom: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.88); color: #0f0; font-family: monospace;
      font-size: 11px; padding: 10px; border-radius: 8px; z-index: 9999;
      max-height: 45vh; overflow-y: auto; display: none;
    }
    #debug div { margin: 2px 0; }
    #debug .ok { color: #0f0; }
    #debug .fail { color: #f66; }
    #debug .warn { color: #ff0; }
    #show-debug {
      position: fixed; top: 10px; right: 10px; z-index: 10000;
      background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    #scanning {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(139,26,26,0.85); padding: 12px 24px;
      border-radius: 24px; font-size: 14px; z-index: 10; pointer-events: none;
      display: none;
    }
    #found {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: #f5e6c8; background: rgba(44,95,63,0.9); padding: 8px 20px;
      border-radius: 16px; font-size: 13px; z-index: 10; display: none;
    }
    #info-panel {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      width: 88%; max-width: 360px; background: rgba(255,255,255,0.97);
      border-radius: 14px; padding: 18px; z-index: 30; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    #info-panel h2 { margin: 0 0 10px; font-size: 17px; color: #8b1a1a; }
    #info-panel p { margin: 0; font-size: 13.5px; line-height: 1.8; color: #333; }
    #info-panel .close {
      position: absolute; top: 10px; right: 14px; font-size: 22px;
      color: #aaa; cursor: pointer; background: none; border: none;
    }
  </style>

  <script>
    var __t0 = Date.now();
    function __log(msg, cls) {
      var dbg = document.getElementById('debug');
      if (dbg) {
        var d = document.createElement('div');
        d.className = cls || '';
        d.textContent = '[' + ((Date.now()-__t0)/1000).toFixed(1) + 's] ' + msg;
        dbg.appendChild(d);
        dbg.scrollTop = dbg.scrollHeight;
      }
      console.log('[AR] ' + msg);
    }
    setTimeout(function() {
      var ld = document.getElementById('loading');
      if (ld && ld.style.display !== 'none') {
        ld.innerHTML = '<h1 style="color:#ff9999">启动超时</h1><p>请点右上角"显示日志"并截图</p>';
        document.getElementById('debug').style.display = 'block';
      }
    }, 30000);
  </script>
</head>
<body>

  <button id="show-debug" onclick="document.getElementById('debug').style.display='block'">显示日志</button>
  <div id="debug"></div>

  <div id="loading">
    <h1>钟阜育英才</h1>
    <p>南京市钟英中学 · 百廿校庆 AR</p>
    <div class="spinner"></div>
    <p>正在加载…</p>
  </div>

  <div id="scanning">📷 将镜头对准校庆海报</div>
  <div id="found">✅ 已识别</div>

  <div id="info-panel">
    <button class="close" onclick="document.getElementById('info-panel').style.display='none'">×</button>
    <h2 id="panel-title"></h2>
    <p id="panel-content"></p>
  </div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: #loading; uiScanning: #scanning;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity light="type: ambient; color: #fff5e6; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; color: #f5c542; intensity: 1.0" position="2 3 2"></a-entity>

      <a-text value="120" color="#f5c542" align="center" width="1.0"
              position="0 0.32 0.08" rotation="-90 0 0"
              animation="property: rotation; from: -90 0 0; to: -90 360 0; loop: true; dur: 7000; easing: linear"></a-text>
      <a-text value="钟英中学 百廿校庆" color="#8b1a1a" align="center" width="1.4"
              position="0 0.14 0.08" rotation="-90 0 0"></a-text>
      <a-text value="勤朴诚毅" color="#2c5f3f" align="center" width="0.8"
              position="0 -0.02 0.08" rotation="-90 0 0"></a-text>

      <a-plane class="clickable" width="0.52" height="0.2" color="#8b1a1a"
               position="-0.36 -0.22 0.08" rotation="-90 0 0"
               data-title="校史沿革"
               data-content="1904年创办，始名承志，后更名钟英，取「钟阜育英才」之意，为南京近代首所私立中学。百廿年来八迁校址，历经抗战西迁，1954年定址秦淮九条巷曾公祠，2014年恢复钟英校名。校训「勤朴诚毅」。">
        <a-text value="校史沿革" color="#f5e6c8" align="center" width="0.48" position="0 0 0.006"></a-text>
      </a-plane>
      <a-plane class="clickable" width="0.52" height="0.2" color="#2c5f3f"
               position="0.36 -0.22 0.08" rotation="-90 0 0"
               data-title="杰出校友"
               data-content="两弹一星元勋任新民、两院院士建筑学家吴良镛、前教育部长刘西尧、著名画家刘宇一、作家叶兆言、演员游本昌……钟阜毓秀，英才辈出。">
        <a-text value="杰出校友" color="#f5e6c8" align="center" width="0.48" position="0 0 0.006"></a-text>
      </a-plane>
      <a-entity id="leaves"></a-entity>
    </a-entity>
  </a-scene>

  <!-- 动态加载JS，带多CDN备用 -->
  <script>
    function loadScript(urls, name) {
      return new Promise(function(resolve, reject) {
        var i = 0;
        function tryNext() {
          if (i >= urls.length) { reject(new Error(name + ' all CDN failed')); return; }
          var s = document.createElement('script');
          s.src = urls[i];
          s.onload = function() { __log(name + ' 加载成功 (' + urls[i].split('/')[2] + ')', 'ok'); resolve(); };
          s.onerror = function() { __log(name + ' 失败: ' + urls[i].split('/')[2], 'warn'); i++; tryNext(); };
          document.head.appendChild(s);
        }
        tryNext();
      });
    }
    loadScript([
      'https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js',
      'https://unpkg.com/mind-ar@1.1.5/dist/mindar-image.prod.js'
    ], 'MINDAR').then(function() {
      return loadScript([
        'https://unpkg.com/aframe@1.4.2/dist/aframe-v1.4.2.min.js',
        'https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-v1.4.2.min.js',
        'https://aframe.io/releases/1.4.2/aframe.min.js'
      ], 'AFRAME');
    }).then(function() {
      return loadScript([
        'https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js',
        'https://unpkg.com/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js'
      ], 'MindAR-AFrame');
    }).then(function() {
      __log('所有库加载完成', 'ok');
      initARLogic();
    }).catch(function(e) {
      __log('加载失败: ' + e.message, 'fail');
      document.getElementById('loading').innerHTML = '<h1 style="color:#ff9999">库加载失败</h1><p>' + e.message + '</p><p style="font-size:11px;margin-top:10px">请检查网络连接后重试</p>';
      document.getElementById('debug').style.display = 'block';
    });
  </script>

  <script>
    function initARLogic() {
    __log('主脚本执行', 'ok');
    __log('MINDAR: ' + (typeof window.MINDAR !== 'undefined' ? '已加载' : '未加载'), typeof window.MINDAR !== 'undefined' ? 'ok' : 'fail');
    __log('AFRAME: ' + (typeof AFRAME !== 'undefined' ? '已加载' : '未加载'), typeof AFRAME !== 'undefined' ? 'ok' : 'fail');

    var scene = document.getElementById('ar-scene');
    scene.addEventListener('loaded', function() { __log('场景 loaded', 'ok'); });
    scene.addEventListener('renderstart', function() { __log('渲染启动', 'ok'); });
    scene.addEventListener('arReady', function() { __log('AR就绪 arReady', 'ok'); });
    scene.addEventListener('arError', function(e) { __log('AR错误: ' + (e.detail && e.detail.error), 'fail'); });
    scene.addEventListener('targetFound', function() {
      __log('>>> 识别成功', 'ok');
      document.getElementById('found').style.display = 'block';
      document.getElementById('scanning').style.display = 'none';
      setTimeout(function(){ document.getElementById('found').style.display = 'none'; }, 3000);
    });
    scene.addEventListener('targetLost', function() { __log('目标丢失', 'warn'); document.getElementById('scanning').style.display = 'block'; });

    setTimeout(function() {
      var c = scene.components['mindar-image'];
      __log('mindar组件: ' + (c ? '存在' : '不存在'), c ? 'ok' : 'fail');
    }, 3000);

    var leaves = document.getElementById('leaves');
    var colors = ['#f5c542', '#e8a317', '#f0d060', '#d4a017'];
    for (var i = 0; i < 15; i++) {
      var leaf = document.createElement('a-plane');
      var x = (Math.random()-0.5)*1.4, y = 0.5+Math.random()*0.4, z = 0.05+Math.random()*0.1;
      leaf.setAttribute('width','0.09'); leaf.setAttribute('height','0.09');
      leaf.setAttribute('position', x+' '+y+' '+z);
      leaf.setAttribute('rotation', '-90 0 '+(Math.random()*360));
      leaf.setAttribute('material', 'color:'+colors[i%4]+'; side:double; transparent:true; opacity:0.92');
      leaf.setAttribute('animation', 'property:position; to:'+(x+(Math.random()-0.5)*0.3)+' -0.45 '+z+'; loop:true; dur:'+(3500+Math.random()*2500)+'; delay:'+(Math.random()*5000)+'; easing:easeInQuad');
      leaves.appendChild(leaf);
    }

    scene.addEventListener('click', function(e) {
      var t = e.target.closest('.clickable');
      if (t) {
        document.getElementById('panel-title').textContent = t.getAttribute('data-title');
        document.getElementById('panel-content').textContent = t.getAttribute('data-content');
        document.getElementById('info-panel').style.display = 'block';
      }
    });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>钟英中学百廿校庆 · 3D 预览</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
    }
    #title-bar {
      position: fixed; top: 0; left: 0; right: 0; padding: 16px;
      background: linear-gradient(180deg, rgba(139,26,26,0.85), transparent);
      color: #f5e6c8; text-align: center; z-index: 20;
    }
    #title-bar h1 { margin: 0; font-size: 20px; letter-spacing: 6px; }
    #title-bar p { margin: 4px 0 0; font-size: 12px; opacity: 0.8; letter-spacing: 2px; }
    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.5); padding: 10px 20px;
      border-radius: 20px; font-size: 13px; z-index: 20; backdrop-filter: blur(6px);
    }
    #info-panel {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      width: 88%; max-width: 360px; background: rgba(255,255,255,0.96);
      border-radius: 12px; padding: 16px; z-index: 30; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3); pointer-events: auto;
    }
    #info-panel h2 { margin: 0 0 8px; font-size: 16px; color: #8b1a1a; }
    #info-panel p { margin: 0; font-size: 13px; line-height: 1.7; color: #333; }
    #info-panel .close {
      position: absolute; top: 8px; right: 12px; font-size: 22px;
      color: #999; cursor: pointer; background: none; border: none;
    }
    .btn-group {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 20;
    }
    .btn {
      padding: 10px 18px; border-radius: 20px; border: none;
      font-size: 13px; color: #f5e6c8; cursor: pointer; pointer-events: auto;
      backdrop-filter: blur(6px);
    }
    .btn-red { background: rgba(139,26,26,0.85); }
    .btn-green { background: rgba(44,95,63,0.85); }
  </style>
</head>
<body>

  <div id="title-bar">
    <h1>钟阜育英才</h1>
    <p>南京市钟英中学 · 1904—2024 · 百廿校庆</p>
  </div>

  <div class="btn-group">
    <button class="btn btn-red" onclick="showPanel('校史沿革','1904年创办，始名承志，后更名钟英，取「钟阜育英才」之意，为南京近代首所私立中学。百廿年来八迁校址，历经抗战西迁，1954年定址秦淮九条巷曾公祠，2014年恢复钟英校名。')">校史沿革</button>
    <button class="btn btn-green" onclick="showPanel('杰出校友','两弹一星元勋任新民、两院院士建筑学家吴良镛、前教育部长刘西尧、著名画家刘宇一、作家叶兆言、演员游本昌……钟阜毓秀，英才辈出。')">杰出校友</button>
  </div>

  <div id="hint">📱 拖动屏幕可旋转视角 · 双指缩放</div>

  <div id="info-panel">
    <button class="close" onclick="document.getElementById('info-panel').style.display='none'">×</button>
    <h2 id="panel-title"></h2>
    <p id="panel-content"></p>
  </div>

  <a-scene background="color: #1a0f0a" renderer="antialias: true; physicallyCorrectLights: true">
    <!-- 灯光 -->
    <a-entity light="type: ambient; color: #ffeedd; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #f5c542; intensity: 1.2" position="5 8 3"></a-entity>
    <a-entity light="type: point; color: #ff6b6b; intensity: 0.8" position="-3 2 2"></a-entity>

    <!-- 相机（可拖拽旋转） -->
    <a-camera look-controls="enableDamping: true" wasd-controls="enabled: false">
      <a-cursor color="#f5c542" fuse="false"></a-cursor>
    </a-camera>

    <!-- 地面 -->
    <a-circle radius="6" rotation="-90 0 0" position="0 -1.5 0"
              material="color: #2c1810; roughness: 0.8; metalness: 0.2"></a-circle>

    <!-- 中央旋转的 120 立体字 -->
    <a-entity position="0 0.5 -2" rotation="0 0 0"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      <a-text value="120" color="#f5c542" align="center" width="3"
              position="0 0 0"
              text="anchor: center; baseline: center; font: https://cdn.aframe.io/fonts/Roboto-msdf.json; negate: false"></a-text>
    </a-entity>

    <!-- 副标题 -->
    <a-text value="钟英中学 · 百廿校庆" color="#f5e6c8" align="center" width="2.5"
            position="0 -0.8 -2" text="anchor: center"></a-text>

    <a-text value="勤朴诚毅" color="#e8c87a" align="center" width="1.5"
            position="0 -1.15 -2" text="anchor: center; baseline: top"></a-text>

    <!-- 左侧：曾公祠建筑剪影（用几何体拼出飞檐意象） -->
    <a-entity position="-2.5 -0.5 -3" rotation="0 25 0">
      <!-- 柱子 -->
      <a-box position="-0.6 0 0" width="0.15" height="1.2" depth="0.15" color="#8b1a1a"></a-box>
      <a-box position="0.6 0 0" width="0.15" height="1.2" depth="0.15" color="#8b1a1a"></a-box>
      <!-- 屋顶（飞檐） -->
      <a-cone position="0 0.85 0" radius-bottom="1.1" radius-top="0.1" height="0.5"
              segments-radial="4" rotation="0 45 0" color="#2c5f3f"></a-cone>
      <a-box position="0 0.65 0" width="1.6" height="0.15" depth="0.8" color="#1a3a28"></a-box>
      <!-- 牌匾 -->
      <a-box position="0 0.3 0.09" width="0.8" height="0.25" depth="0.05" color="#1a1a1a"></a-box>
      <a-text value="曾公祠" color="#f5c542" align="center" width="0.7"
              position="0 0.3 0.13" text="anchor: center; baseline: center"></a-text>
    </a-entity>

    <!-- 右侧：现代教学楼意象 -->
    <a-entity position="2.5 -0.5 -3" rotation="0 -25 0">
      <a-box position="0 0.3 0" width="1.4" height="1.8" depth="0.6"
             material="color: #4a6fa5; roughness: 0.3; metalness: 0.7; opacity: 0.85; transparent: true"></a-box>
      <!-- 窗户网格 -->
      <a-box position="0 0.3 0.32" width="1.2" height="1.5" depth="0.02" color="#87ceeb" opacity="0.4" transparent="true"></a-box>
      <a-text value="钟英" color="#ffffff" align="center" width="0.8"
              position="0 0.8 0.35" text="anchor: center; baseline: center"></a-text>
    </a-entity>

    <!-- 飘落银杏叶 -->
    <a-entity id="leaves"></a-entity>

    <!-- 底部星火粒子 -->
    <a-entity id="sparks"></a-entity>
  </a-scene>

  <script>
    // 银杏叶飘落
    const leaves = document.getElementById('leaves');
    for (let i = 0; i < 25; i++) {
      const leaf = document.createElement('a-plane');
      const x = (Math.random() - 0.5) * 8;
      const z = -1 - Math.random() * 4;
      const y = 3 + Math.random() * 2;
      const delay = Math.random() * 5000;
      const dur = 4000 + Math.random() * 3000;
      leaf.setAttribute('width', '0.12');
      leaf.setAttribute('height', '0.12');
      leaf.setAttribute('position', `${x} ${y} ${z}`);
      leaf.setAttribute('rotation', `${Math.random()*360} ${Math.random()*360} ${Math.random()*360}`);
      leaf.setAttribute('material', `color: #${['f5c542','e8a317','f0d060','d4a017'][Math.floor(Math.random()*4)]}; side: double; transparent: true; opacity: 0.9`);
      leaf.setAttribute('animation', `property: position; to: ${x + (Math.random()-0.5)*0.5} -2 ${z}; loop: true; dur: ${dur}; delay: ${delay}; easing: easeInQuad`);
      leaf.setAttribute('animation__2', `property: rotation; to: ${Math.random()*720} ${Math.random()*720} ${Math.random()*720}; loop: true; dur: ${dur}; delay: ${delay}; easing: linear`);
      leaves.appendChild(leaf);
    }

    // 底部星火
    const sparks = document.getElementById('sparks');
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('a-sphere');
      const x = (Math.random() - 0.5) * 5;
      const z = -1.5 - Math.random() * 2;
      const delay = Math.random() * 3000;
      const dur = 2000 + Math.random() * 2000;
      s.setAttribute('radius', '0.02');
      s.setAttribute('position', `${x} -1.4 ${z}`);
      s.setAttribute('material', `color: #ff9933; emissive: #ff6600; emissiveIntensity: 1`);
      s.setAttribute('animation', `property: position; to: ${x} ${-0.5 + Math.random()} ${z}; loop: true; dur: ${dur}; delay: ${delay}; easing: easeOutCubic`);
      s.setAttribute('animation__2', `property: material.opacity; to: 0; loop: true; dur: ${dur}; delay: ${delay}; easing: easeInCubic`);
      sparks.appendChild(s);
    }

    function showPanel(title, content) {
      document.getElementById('panel-title').textContent = title;
      document.getElementById('panel-content').textContent = content;
      document.getElementById('info-panel').style.display = 'block';
    }
  </script>
</body>
</html>

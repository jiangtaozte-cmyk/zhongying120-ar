    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    html, body { width: 100%; height: 100%; }
    /* MindAR 用 a-scene.parentNode 作为摄像头视频尺寸与 3D 相机投影(fov/aspect)的基准。
       本项目把 a-scene 包在 #scene-container 里，该 div 默认无高度 → 视频只铺一半、下方黑屏。
       把它撑满视口即可，视频和 3D 内容会用同一个正确尺寸对齐。 */
    #scene-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    /* 兜底：MindAR 用 .hidden 类切换遮罩可见性 */
    .hidden { display: none !important; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #f5e6c8;
      background: linear-gradient(135deg, #8b1a1a 0%, #2c1810 100%); z-index: 999;
      text-align: center;
    }
    #loading h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: 6px; }
    #loading p { font-size: 12px; opacity: 0.7; margin: 3px 0; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(245,230,200,0.2);
      border-top-color: #f5e6c8; border-radius: 50%;
      animation: spin 1s linear infinite; margin: 16px 0 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #start-btn {
      margin-top: 4px; padding: 11px 30px; font-size: 16px; color: #2c1810;
      background: linear-gradient(135deg, #f5c542, #e8a317); border: none; border-radius: 26px;
      cursor: pointer; font-weight: bold; letter-spacing: 3px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35); font-family: inherit;
    }
    #start-btn:disabled {
      background: rgba(245,230,200,0.18); color: rgba(245,230,200,0.5); cursor: not-allowed; box-shadow: none;
    }
    #start-btn:not(:disabled):active { transform: scale(0.97); }
    #show-debug { display: none; }   /* 对外隐藏"显示日志"按钮（调试用，不外露） */
    #debug {
      position: fixed; bottom: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.88); color: #0f0; font-family: monospace;
      font-size: 11px; padding: 10px; border-radius: 8px; z-index: 9999;
      max-height: 45vh; overflow-y: auto; display: none;
    }
    #debug div { margin: 2px 0; }
    #debug .ok { color: #0f0; }
    #debug .fail { color: #f66; }
    #debug .warn { color: #ff0; }
    #show-debug {
      position: fixed; top: 10px; right: 10px; z-index: 10000;
      background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;

    #scanning {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(139,26,26,0.85); padding: 12px 24px;
      border-radius: 24px; font-size: 14px; z-index: 10; pointer-events: none;
      display: none; white-space: nowrap;
    }
    #found {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: #f5e6c8; background: rgba(44,95,63,0.92); padding: 8px 20px;
      border-radius: 16px; font-size: 13px; z-index: 10; display: none; white-space: nowrap;
    }
    /* 校友生平弹窗（星光墙）——面板限高、正文内部滚动，避免顶满整屏 */
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; }
    #overlay.show { display: flex; }
    #panel { width: 100%; max-width: 420px; max-height: 88vh; display: flex; flex-direction: column; background: #f5e6c8; border-radius: 16px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55); border: 3px solid #f5c542; animation: pop .28s cubic-bezier(.2,.9,.3,1.2); position: relative; }
    @keyframes pop { from{ transform: scale(.85); opacity: 0 } to{ transform: scale(1); opacity: 1 } }
    #panel .ph { flex: 0 0 auto; background: linear-gradient(135deg,#8b1a1a,#5a1010); color: #f5c542; padding: 12px 18px; }
    #panel .ph .num { font-size: 13px; opacity: .7; letter-spacing: 2px; }

    #panel .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    #panel .btn { flex: 1; border: none; border-radius: 24px; padding: 10px 0; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
    #panel .x { position: absolute; top: 10px; right: 12px; color: #f5e6c8; font-size: 24px; cursor: pointer; line-height: 1; opacity: .8; z-index: 2; }

  <script>
    function loadScript(urls, name, verify, useFetch) {
      return new Promise(function(resolve, reject) {
        var i = 0;
        function tryNext() {
          if (i >= urls.length) { reject(new Error(name + ' all CDN failed')); return; }
          var url = urls[i];
          if (useFetch) {
            // fetch方式：下载代码后手动eval，避免UMD走CommonJS分支
            fetch(url).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); }).then(function(code) {
              // 清除可能干扰UMD的全局变量
              var _m = window.module, _e = window.exports, _d = window.define;
              delete window.module; delete window.exports; delete window.define;
              try { (0, eval)(code); } catch(err) { __log(name+' 执行错误: '+err.message, 'fail'); }
              if (_m) window.module = _m; if (_e) window.exports = _e; if (_d) window.define = _d;
              if (verify && !verify()) { __log(name+' fetch后未定义 ('+url.split('/')[2]+')，换下一个', 'warn'); i++; tryNext(); }
              else { __log(name+' 加载成功 ('+url.split('/')[2]+')', 'ok'); resolve(); }
            }).catch(function() { __log(name+' fetch失败: '+url.split('/')[2], 'warn'); i++; tryNext(); });
          } else {
            var s = document.createElement('script');
            s.src = url;
            s.onload = function() {
              if (verify && !verify()) { __log(name+' 加载但未定义 ('+url.split('/')[2]+')，换下一个', 'warn'); i++; tryNext(); }
              else { __log(name+' 加载成功 ('+url.split('/')[2]+')', 'ok'); resolve(); }
            };
            s.onerror = function() { __log(name+' 失败: '+url.split('/')[2], 'warn'); i++; tryNext(); };
            document.head.appendChild(s);
          }
        }
        tryNext();
      });
    }
    loadScript([
      'https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js',
      'https://unpkg.com/mind-ar@1.1.5/dist/mindar-image.prod.js'
    ], 'MINDAR', function(){ return typeof window.MINDAR !== 'undefined'; }).then(function() {

        'https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-v1.4.2.min.js',
        'https://unpkg.com/aframe@1.4.2/dist/aframe-v1.4.2.min.js'

        'https://unpkg.com/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js'
      ], 'MindAR-AFrame');
    }).then(function() {
      __log('所有库加载完成', 'ok');
      initARLogic();
    }).catch(function(e) {
      __log('加载失败: ' + e.message, 'fail');
      document.getElementById('loading').innerHTML = '<h1 style="color:#ff9999">库加载失败</h1><p>' + e.message + '</p><p style="font-size:11px;margin-top:10px">请检查网络连接后重试</p>';
      document.getElementById('debug').style.display = 'block';
    });
  </script>

  <script>
    function initARLogic() {
    __log('主脚本执行', 'ok');
    __log('BUILD: xiaoyou-4fix-2 ([wander]入口+入场日志)', 'ok');
    __log('MINDAR: ' + (typeof window.MINDAR !== 'undefined' ? '已加载' : '未加载'), typeof window.MINDAR !== 'undefined' ? 'ok' : 'fail');
    __log('AFRAME: ' + (typeof AFRAME !== 'undefined' ? '已加载' : '未加载'), typeof AFRAME !== 'undefined' ? 'ok' : 'fail');

    // ---- CJK 文字纹理：A-Frame a-text 用 Roboto 位图字体，无中文字形 → 中文全变空白。
    //     改用 canvas 按设备系统字体绘制，iOS/Android 中文正常显示。----
    AFRAME.registerComponent('cjktext', {
      schema: {
        value:  { type: 'string', default: '' },
        color:  { type: 'string', default: '#2c1810' },
        width:  { type: 'number', default: 1.0 },   // AR 世界宽度（米）
        wrap:   { type: 'number', default: 0 },      // 每行最大字符数，0=不换行
        weight: { type: 'number', default: 400 },   // 楷体/书法字形仅 400，默认不再粗体
        pad:    { type: 'number', default: 40 },
        outline:     { type: 'string', default: '' },   // 描边色；空=不描边（浅色字加一圈深色边，米色卡面上才清晰）
        outlineWidth:{ type: 'number', default: 6 }     // 相对 200px 字号的描边粗细
      },
      update: function () {
        var d = this.data;
        var value = (d.value == null ? '' : String(d.value));
        // 按字符数换行（CJK 近似全宽，够用）
        var raw = value.split('\n'), lines = [];
        for (var r = 0; r < raw.length; r++) {
          if (d.wrap && d.wrap > 0 && raw[r].length > d.wrap) {
            var cur = '';
            for (var k = 0; k < raw[r].length; k++) {
              cur += raw[r][k];
              if (cur.length >= d.wrap) { lines.push(cur); cur = ''; }
            }
            if (cur) lines.push(cur);
          } else { lines.push(raw[r]); }
        }
        if (!lines.length) lines = [''];
        // 优先 webfont 楷书(马善政楷体 Ma Shan Zheng)，其次系统楷体，再宋体，末位通用 serif
        var fam = '"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","楷体","BiauKai","DFKai-SB","Noto Serif SC","Songti SC","SimSun",serif';
        var fs = 200;
        var c = document.createElement('canvas'), ctx = c.getContext('2d');
        ctx.font = d.weight + ' ' + fs + 'px ' + fam;
        var maxW = 0;
        lines.forEach(function (l) { maxW = Math.max(maxW, ctx.measureText(l).width); });
        var lh = fs * 1.24, pad = d.pad;
        c.width  = Math.max(2, Math.ceil(maxW + pad * 2));
        c.height = Math.max(2, Math.ceil(lh * lines.length + pad * 2));
        ctx.font = d.weight + ' ' + fs + 'px ' + fam;
        ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
        var doOutline = d.outline ? true : false;
        ctx.fillStyle = d.color;
        if (doOutline) { ctx.strokeStyle = d.outline; ctx.lineWidth = d.outlineWidth; ctx.lineJoin = 'round'; }
        for (var i = 0; i < lines.length; i++) {
          if (doOutline) ctx.strokeText(lines[i], c.width / 2, pad + lh / 2 + i * lh);
          ctx.fillText(lines[i], c.width / 2, pad + lh / 2 + i * lh);
        }
        var tex = new THREE.CanvasTexture(c);
        tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
        var mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(d.width, d.width * c.height / c.width),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
        );
        this.el.setObject3D('mesh', mesh);
      }
    });

    // ---- 星光：canvas 绘制的发光五角星纹理贴在平面上（替代纯色 a-plane 方块）----
    AFRAME.registerComponent('star', {
      schema: {
        size:  { type: 'number', default: 0.24 },   // AR 世界尺寸（米）
        color: { type: 'string', default: '#f5c542' }
      },
      update: function () {
        var d = this.data;
        var c = document.createElement('canvas'); c.width = c.height = 256;
        var ctx = c.getContext('2d');
        var cx = 128, cy = 128, R = 118, r = 50;
        // 深色软晕（画在星星之下）：米色卡面上金字靠"影"而非"光"来托起、显分离
        // 在星星轮廓附近形成一圈暗，向外淡出，让金色从米色卡面"浮起"
        var glow = ctx.createRadialGradient(cx, cy, R * 0.62, cx, cy, R + 22);
        glow.addColorStop(0, 'rgba(44,24,16,0)');
        glow.addColorStop(0.5, 'rgba(44,24,16,0.38)');
        glow.addColorStop(1, 'rgba(44,24,16,0)');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, 256, 256);
        // 五角星（上顶点朝上）
        ctx.beginPath();
        for (var i = 0; i < 10; i++) {
          var ang = -Math.PI / 2 + i * Math.PI / 5;
          var rad = (i % 2 === 0) ? R : r;
          var px = cx + rad * Math.cos(ang), py = cy + rad * Math.sin(ang);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = d.color; ctx.fill();
        ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = '#c97a12'; ctx.stroke();
        ctx.lineWidth = 3.5; ctx.strokeStyle = '#3a2415'; ctx.stroke();
        var tex = new THREE.CanvasTexture(c);
        tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
        var mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(d.size, d.size),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
        );
        this.el.setObject3D('mesh', mesh);
      }
    });

    // ---- 星群游动：校友星在框内漂浮，撞边与互撞都变向，动感更强 ----
    var _wanders = [];
    AFRAME.registerComponent('wander', {
      schema: {
        speed: { type: 'number', default: 0.0010 },
        r:     { type: 'number', default: 0.13 },  // 碰撞半径
        enterDelay: { type: 'number', default: 0 },   // 入场：该颗延迟 ms（逐颗升起用）
        enterDepth: { type: 'number', default: 0.5 }  // 入场：从卡面深处往镜头方向飞行的距离（米），从远及近
      },
      init: function () {
        this.entering = false;                     // 入场升起开关（识别到卡由 enter() 触发）
        this.minX = -0.48; this.maxX = 0.48;       // 避开标题/年代/提示占位
        this.minY = -0.42; this.maxY = 0.42;
        var s = this.data.speed;
        var a = Math.random() * Math.PI * 2;
        var m = s * (0.6 + Math.random() * 0.8);
        this.vx = Math.cos(a) * m;
        this.vy = Math.sin(a) * m;
        this.me = this.el.object3D;
        _wanders.push(this);
      },
      enter: function () {
        this.entering = true;
        this.enterT0 = performance.now();
        this.homeX = this.me.position.x;                  // 落点（STARS 坐标）
        this.homeY = this.me.position.y;
        this.homeZ = this.me.position.z;                  // ≈0.09，靠镜头一侧
        this.startZ = this.homeZ - this.data.enterDepth;  // 起点更深(远离镜头)，沿 z 朝镜头飞行 = 从远及近
        this.me.position.set(this.homeX, this.homeY, this.startZ);
        this.me.scale.set(0.05, 0.05, 1);                 // 起点极小，飞近后放大
        this.enterDur = 2200;                             // 升起/飞来更慢一些
      },
      tick: function () {
        var p = this.me.position;
        // 入场：未到该颗延迟时刻停在卡面深处；用 easeOutCubic 沿 z 朝镜头"飞"到落点、从小放大，升完再接回漂移
        if (this.entering){
          var t = (performance.now() - this.enterT0 - this.data.enterDelay) / this.enterDur;
          if (t < 0) return;                          // 未到该颗，停在深处
          if (t >= 1){ t = 1; this.entering = false; }
          t = 1 - Math.pow(1 - t, 3);                 // easeOutCubic
          p.x = this.homeX; p.y = this.homeY;         // x/y 不动，只作深度飞行
          p.z = this.startZ + (this.homeZ - this.startZ) * t;  // 从远(z-0.5)到近(z=0.09)，朝镜头
          var sc = 0.05 + 0.95 * t;                   // 边长从 0.05 放大到 1
          this.me.scale.set(sc, sc, 1);
          if (this.entering) return;
        }
        this.me.scale.set(1, 1, 1);                    // 入场结束后恢复原始比例
        // 撞边反弹
        if (p.x < this.minX){ p.x = this.minX; this.vx = Math.abs(this.vx); }
        else if (p.x > this.maxX){ p.x = this.maxX; this.vx = -Math.abs(this.vx); }
        if (p.y < this.minY){ p.y = this.minY; this.vy = Math.abs(this.vy); }
        else if (p.y > this.maxY){ p.y = this.maxY; this.vy = -Math.abs(this.vy); }
        // 两两互撞：星距小于 2r 则沿连线拉开并反射速度，形成"撞后变向"
        var min = this.data.r * 2;

        redrawCJK();
        if (++attempts < 8) setTimeout(pump, 800);
      })();
      if (document.fonts && document.fonts.load) {
        ['400 200px "Ma Shan Zheng"', '400 200px "Kaiti SC"', '400 200px "Noto Serif SC"', '700 200px "Noto Serif SC"'].forEach(function(spec){
          try { document.fonts.load(spec).then(redrawCJK); } catch (e) {}
        });
        if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', redrawCJK);
        if (document.fonts.ready) document.fonts.ready.then(redrawCJK);
      }
    }
    setTimeout(readySerif, 1200);

    // 设介绍文本（cjktext 对象赋值，规避 a-text 中文空白；全角标点安全）
    cards.forEach(function(c){
      var el = document.getElementById('intro-' + c.id);
      if (el) el.setAttribute('cjktext', { value: c.intro, color: '#2c1810', width: 1.05, wrap: 18 });
    });

    var scene = document.getElementById('ar-scene');
    scene.addEventListener('loaded', function(){ __log('场景 loaded', 'ok'); unlockVideos(); });
    scene.addEventListener('renderstart', function(){ __log('渲染启动', 'ok'); });
    scene.addEventListener('arReady', function(){
      arReadyFired = true;
      __log('AR就绪 arReady', 'ok');
      startBtn.disabled = false;
      startBtn.textContent = '开始体验';
      // 已就绪、显示"开始体验"，加载图标消除显示，但要保留它占的位置（visibility:hidden 而非 display:none），
      // 否则下方"开始体验"按钮和标题的位置会整体上移
      var sp = document.getElementById('loading').querySelector('.spinner');
      if (sp) sp.style.visibility = 'hidden';
    });
    scene.addEventListener('arError', function(e){
      var err = (e.detail && e.detail.error) || '';
      __log('AR错误: ' + err, 'fail');
      var ld = document.getElementById('loading');
      if (ld) ld.innerHTML = '<h1 style="color:#ff9999">摄像头无法启动</h1>'
        + '<p>' + err + '</p>'
        + '<p style="font-size:11px;margin-top:10px">请确认：1) 页面为 HTTPS 或 localhost；'
        + '2) 已授予相机权限；3) 浏览器支持 WebGL</p>';
    });

    // 银杏叶（按卡惰性生成，仅首次识别时）
    var leavesSpawned = {};
    var starsEntered = {};
    // 入场只在"用户已开始体验(遮罩消失)"且"识别到星墙卡"都满足后才播，否则会挡在 #loading 遮罩后看不到
    var userStarted = false, lastFoundCard = '';
    function maybeEnterStars(id){
      if (!userStarted) return;
      if (!id || starsEntered[id]) return;
      var c = cardsById[id];
      if (!c || c.type !== 'starwall') return;
      starsEntered[id] = true;
      var root = document.getElementById('card-' + id);
      // wander 是 a-entity 上的属性而非标签，须用属性选择器 [wander] 才会选中这些星
      var entered = 0;
      if (root) root.querySelectorAll('[wander]').forEach(function(el){
        var w = el.components.wander; if (w && w.enter){ w.enter(); entered++; }
      });
      __log('入场动画: ' + entered + ' 颗星升起', entered ? 'ok' : 'fail');
    }
    function spawnLeaves(id){
      if (leavesSpawned[id]) return; leavesSpawned[id] = true;
      var container = document.getElementById('leaves-' + id); if (!container) return;
      // 星光墙：飘落的粒子用发光小星组成，而非方块
      for (var i = 0; i < 9; i++) {
        var star = document.createElement('a-entity');
        var x = (Math.random()-0.5)*1.2, y = 0.4 + Math.random()*0.5, z = 0.05 + Math.random()*0.12;
        star.setAttribute('star', 'size: 0.05; color: ' + (i%2 ? '#f0d060' : '#e8a317'));
        star.setAttribute('position', x + ' ' + y + ' ' + z);
        star.setAttribute('rotation', '0 0 ' + (Math.random()*360));
        star.setAttribute('animation', 'property:position; to:' + (x+(Math.random()-0.5)*0.3) + ' -0.6 ' + z + '; loop:true; dur:' + (3500+Math.random()*2500) + '; delay:' + (Math.random()*4000) + '; easing:easeInQuad');
        container.appendChild(star);
      }
    }

    scene.addEventListener('targetFound', function(e){
      var id = e.target.getAttribute('data-card-id');
      lastFoundCard = id;
      __log('>>> 识别: ' + (id || '?'), 'ok');
      var c = cardsById[id];
      var f = document.getElementById('found');
      if (f) { f.style.display = 'block'; f.textContent = '✅ ' + (c ? c.title : ('已识别：' + id)); }
      var sc = document.getElementById('scanning'); if (sc) sc.style.display = 'none';
      setTimeout(function(){ var ff = document.getElementById('found'); if (ff) ff.style.display = 'none'; }, 2500);
      spawnLeaves(id);
      maybeEnterStars(id);
      if (c) {
        if (speechPrimed) speak('intro-' + c.id, c.intro);
        if (c.hasVideo) { var m = getVideoMedia(id); if (m) { try { var p = m.play(); if (p && p.catch) p.catch(function(){}); } catch (e) {} } }
      }
    });
    scene.addEventListener('targetLost', function(e){
      var id = e.target.getAttribute('data-card-id') || '';
      __log('目标丢失: ' + id, 'warn');
      var sc = document.getElementById('scanning'); if (sc) sc.style.display = 'block';
      var f = document.getElementById('found'); if (f) f.style.display = 'none';
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      stopCurAudio();
      var c = cardsById[id];
      if (c && c.hasVideo) { var m = getVideoMedia(id); if (m) { try { m.pause(); } catch (e) {} } }
    });

    // 点击/触摸拾取：把每个 .clickable 的世界坐标投到屏幕，命中最近且在阈值内的那个。
    // 弃用 Raycaster 与 A-Frame cursor —— 在 MindAR/A-Frame 下 tap 时相机与场景树不可靠，投影命中更稳。
    var _pv = new THREE.Vector3();
    var _lastTap = 0;
    function getCam(){
      if (scene.camera) return scene.camera;
      var a = scene.querySelector('a-camera');
      if (a && a.getObject3D){ var c = a.getObject3D('camera'); if (c) return c; }
      var sys = scene.systems && scene.systems.camera;
      if (sys && sys.cameraEl){ var c2 = sys.cameraEl.getObject3D('camera'); if (c2) return c2; }
      return null;
    }
    function findClickableAt(cx, cy){
      var cam = getCam(); if (!cam) return { el: null, d: Infinity };
      var canvas = scene.canvas || document.querySelector('#scene-container canvas');
      if (!canvas) return { el: null, d: Infinity };
      var rect = canvas.getBoundingClientRect();
      var best = null, bestD = Infinity;
      var list = document.querySelectorAll('#ar-scene .clickable');
      for (var i = 0; i < list.length; i++){
        var el = list[i];
        var te = el.closest('mindar-image-target');        // 只命中已跟踪(可见)目标的内容
        if (te){ var w = te.object3D, vis = true; while (w){ if (!w.visible){ vis = false; break; } w = w.parent; } if (!vis) continue; }
        el.object3D.getWorldPosition(_pv);
        _pv.project(cam);
        if (_pv.z < -1 || _pv.z > 1) continue;
        var sx = (_pv.x * 0.5 + 0.5) * rect.width + rect.left;
        var sy = (-_pv.y * 0.5 + 0.5) * rect.height + rect.top;
        var d = Math.sqrt((sx - cx) * (sx - cx) + (sy - cy) * (sy - cy));
        if (d < bestD){ bestD = d; best = el; }
      }
      return { el: best, d: bestD };
    }
    function pickAt(cx, cy){
      var now = Date.now(); if (now - _lastTap < 350) return; _lastTap = now;
      if (!getCam()){ __log('拾取: 无相机', 'fail'); return; }
      var res = findClickableAt(cx, cy);
      if (!res.el){ __log('拾取: 无命中', 'warn'); return; }
      var canvas = scene.canvas || document.querySelector('#scene-container canvas');
      var thr = Math.max(64, (canvas ? canvas.getBoundingClientRect().width : 320) * 0.09);
      if (res.d > thr){ __log('拾取: 太远(' + Math.round(res.d) + 'px)', 'warn'); return; }
      var el = res.el;
      var alumId = el.getAttribute('data-alum-id');
      if (alumId !== null && alumId !== undefined){ __log('拾取: 校友#' + alumId, 'ok'); openAlum(parseInt(alumId,10)); return; }
      var action = el.getAttribute('data-action');
      var cardId = el.getAttribute('data-card-id');
      if (action === 'narrate' && cardId && cardsById[cardId]){ primeSpeech(); speak('intro-' + cardId, cardsById[cardId].intro); __log('语音解说:' + cardId, 'ok'); }
    }
    scene.addEventListener('click', function(e){ pickAt(e.clientX, e.clientY); });
    scene.addEventListener('touchend', function(e){ var t = (e.changedTouches && e.changedTouches[0]); if (t) pickAt(t.clientX, t.clientY); });

    // 生平弹窗控件
    document.getElementById('close').addEventListener('click', closeAlum);
    document.getElementById('close-x').addEventListener('click', closeAlum);
    document.getElementById('narrate').addEventListener('click', function(){ primeSpeech(); if (_alumId) speak('alum-'+_alumId, document.getElementById('p-bio').textContent); });
    document.getElementById('photo-wrap').addEventListener('click', function(e){ e.stopPropagation(); showPhoto(_pi+1); });
    var ovEl = document.getElementById('overlay');
    if (ovEl) ovEl.addEventListener('click', function(e){ if(e.target===ovEl) closeAlum(); });

    // 组件自检（调试）
    setTimeout(function(){
      var c = scene.components['mindar-image'];
      __log('mindar组件: ' + (c ? '存在' : '不存在'), c ? 'ok' : 'fail');
      if (c) {
        __log('mindar系统: ' + (scene.systems['mindar-image-system'] ? '存在' : '不存在'), scene.systems['mindar-image-system'] ? 'ok' : 'fail');
      }
    }, 3000);

    // 30s 超时：仅当 arReady 未触发时报警（arReady 后等待用户点"开始体验"不算超时）
    setTimeout(function(){
      if (arReadyFired) return;
      var ld = document.getElementById('loading');
      if (ld && ld.style.display !== 'none') {
        ld.innerHTML = '<h1 style="color:#ff9999">启动超时</h1><p>AR 未就绪，请点右上角"显示日志"并截图反馈</p>';
        document.getElementById('debug').style.display = 'block';
      }
    }, 30000);
    }
  </script>
</body>
</html>
